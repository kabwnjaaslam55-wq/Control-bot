<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - تسجيل الدخول</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b132b; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background: #1c2541; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; }
        h2 { text-align: center; margin-bottom: 20px; color: #6fffe9; }
        .bot-info { background: #0b132b; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-size: 14px; display: none; border: 1px solid #3a506b; color: #6fffe9; }
        label { display: block; margin: 10px 0 5px; font-size: 14px; color: #cbd5e1; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #3a506b; border-radius: 8px; background: #0b132b; color: #fff; outline: none; margin-bottom: 5px; }
        input[type="file"] { padding: 8px; background: #1c2541; cursor: pointer; }
        input:focus, textarea:focus, select:focus { border-color: #6fffe9; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; background: #5bc0be; border: none; border-radius: 8px; color: #0b132b; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #6fffe9; }
        button.secondary { background: #3a506b; color: #fff; }
        button.secondary:hover { background: #4c637d; }
        button.danger { background: #e63946; color: #fff; }
        button.danger:hover { background: #d62828; }
        .voice-controls { display: flex; gap: 10px; align-items: center; margin-top: 5px; }
        #status, #loginStatus { margin-top: 15px; text-align: center; font-size: 14px; word-break: break-word; }
        .footer { margin-top: 25px; text-align: center; font-size: 14px; border-top: 1px solid #3a506b; padding-top: 15px; }
        .footer a { color: #6fffe9; text-decoration: none; font-weight: bold; }
        .footer a:hover { text-decoration: underline; }
        .hidden { display: none !important; }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #e63946; color: white; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; width: auto; flex: none; }
        
        .support-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #1c2541;
            border: 1px solid #3a506b;
            padding: 10px 15px;
            border-radius: 30px;
            font-size: 13px;
            color: #6fffe9;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            transition: 0.2s;
        }
        .support-badge:hover {
            background: #2b3a5c;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    
    <div id="loginSection">
        <h2>🛡صفحه تسجيل دخول🛡</h2>
        <h3>اكتب اي يوزر وباسورد</h3>
        <label>اسم المستخدم:</label>
        <input type="text" id="username" placeholder="اكتب أي اسم">
        
        <label>كلمة السر:</label>
        <input type="password" id="password" placeholder="اكتب أي كلمة سر">
        
        <button onclick="login()" style="margin-top: 15px;">دخول</button>
        <div id="loginStatus"></div>
    </div>

    <div id="appSection" class="hidden">
        <div class="header-top">
            <h2>لوحة التحكم المتقدمة</h2>
            <button class="logout-btn" onclick="logout()">خروج 🚪</button>
        </div>

        <div id="botInfo" class="bot-info"></div>
        
        <label>توكن البوت (Bot Token):</label>
        <input type="text" id="token" placeholder="اكتب التوكن هنا...">

        <label>نوع الوسائط / الإرسال:</label>
        <select id="msgType" onchange="toggleType()">
            <option value="text">رسالة نصية</option>
            <option value="photo">رفع صورة</option>
            <option value="video">رفع فيديو</option>
            <option value="document">رفع ملف / مستند</option>
            <option value="voice">تسجيل بصمة صوتية</option>
        </select>

        <div id="fileGroup" style="display: none;">
            <label id="fileLabel">اختر الملف:</label>
            <input type="file" id="fileInput">
        </div>

        <div id="voiceGroup" style="display: none;">
            <label>تسجيل الصوت:</label>
            <div class="voice-controls">
                <button id="startRecordBtn" class="secondary" onclick="startRecording()">ابدأ التسجيل 🎙️</button>
                <button id="stopRecordBtn" class="danger" onclick="stopRecording()" disabled>إيقاف 🛑</button>
            </div>
            <audio id="audioPreview" controls style="display: none; width: 100%; margin-top: 10px;"></audio>
        </div>

        <div id="textGroup">
            <label id="textLabel">نص الرسالة:</label>
            <textarea id="message" rows="3" placeholder="اكتب النص هنا (يدعم HTML)..."></textarea>
        </div>

        <div class="btn-group">
            <button class="secondary" onclick="checkBot()">فحص البوت</button>
            <button onclick="sendData()">إرسال البيانات للجميع</button>
        </div>

        <div id="status"></div>
    </div>

    <div class="footer">
        حقوق المطور: <a href="https://t.me/sayoda_elgadar" target="_blank">EL-SAYED HASA</a>
    </div>
</div>

<a href="https://wa.me/201128351702" target="_blank" class="support-badge">
    💬 الدعم الفني
</a>

<script>
let mediaRecorder;
let audioChunks = [];
let recordedAudioBlob = null;

window.onload = () => {
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
        showApp();
    }
    if(localStorage.getItem('bot_token')) document.getElementById('token').value = localStorage.getItem('bot_token');
};

function login() {
    sessionStorage.setItem('isLoggedIn', 'true');
    showApp();
}

function logout() {
    sessionStorage.removeItem('isLoggedIn');
    document.getElementById('appSection').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('loginStatus').innerText = '';
}

function showApp() {
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('appSection').classList.remove('hidden');
}

function toggleType() {
    const type = document.getElementById('msgType').value;
    const fileGroup = document.getElementById('fileGroup');
    const voiceGroup = document.getElementById('voiceGroup');
    const textGroup = document.getElementById('textGroup');
    const fileInput = document.getElementById('fileInput');
    const fileLabel = document.getElementById('fileLabel');
    const textLabel = document.getElementById('textLabel');

    fileGroup.style.display = 'none';
    voiceGroup.style.display = 'none';
    textGroup.style.display = 'block';

    if (type === 'photo') {
        fileGroup.style.display = 'block';
        fileInput.accept = 'image/*';
        fileLabel.innerText = 'اختر صورة من جهازك:';
        textLabel.innerText = 'شرح الصورة (Caption):';
    } else if (type === 'video') {
        fileGroup.style.display = 'block';
        fileInput.accept = 'video/*';
        fileLabel.innerText = 'اختر فيديو من جهازك:';
        textLabel.innerText = 'شرح الفيديو (Caption):';
    } else if (type === 'document') {
        fileGroup.style.display = 'block';
        fileInput.accept = '*/*';
        fileLabel.innerText = 'اختر ملف من جهازك:';
        textLabel.innerText = 'شرح الملف (Caption):';
    } else if (type === 'voice') {
        voiceGroup.style.display = 'block';
        textLabel.innerText = 'شرح الصوت (Caption):';
    } else {
        textLabel.innerText = 'نص الرسالة:';
    }
}

async function startRecording() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
            if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = () => {
            recordedAudioBlob = new Blob(audioChunks, { type: 'audio/ogg' });
            const audioUrl = URL.createObjectURL(recordedAudioBlob);
            const audioPreview = document.getElementById('audioPreview');
            audioPreview.src = audioUrl;
            audioPreview.style.display = 'block';
        };

        mediaRecorder.start();
        document.getElementById('startRecordBtn').disabled = true;
        document.getElementById('stopRecordBtn').disabled = false;
        document.getElementById('status').style.color = '#f59e0b';
        document.getElementById('status').innerText = 'جاري تسجيل الصوت...';
    } catch (err) {
        alert('تعذر الوصول إلى الميكروفون!');
    }
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        document.getElementById('startRecordBtn').disabled = false;
        document.getElementById('stopRecordBtn').disabled = true;
        document.getElementById('status').style.color = '#22c55e';
        document.getElementById('status').innerText = 'تم تسجيل الصوت بنجاح!';
    }
}

async function checkBot() {
    const token = document.getElementById('token').value.trim();
    const status = document.getElementById('status');
    const botInfoDiv = document.getElementById('botInfo');

    if (!token) {
        status.style.color = '#ef4444';
        status.innerText = 'أدخل التوكن أولاً للفحص.';
        return;
    }

    status.style.color = '#f59e0b';
    status.innerText = 'جاري الاتصال بالبوت...';

    try {
        const res = await fetch(`https://api.telegram.org/bot${token}/getMe`);
        const data = await res.json();
        if (data.ok) {
            status.style.color = '#22c55e';
            status.innerText = 'تم الاتصال بالبوت بنجاح!';
            botInfoDiv.style.display = 'block';
            botInfoDiv.innerHTML = `اسم البوت: <b>${data.result.first_name}</b> (@${data.result.username})`;
            localStorage.setItem('bot_token', token);
        } else {
            status.style.color = '#ef4444';
            status.innerText = 'التوكن غير صحيح!';
            botInfoDiv.style.display = 'none';
        }
    } catch (e) {
        status.style.color = '#ef4444';
        status.innerText = 'حدث خطأ في الاتصال بالشبكة.';
    }
}

async function sendData() {
    const token = document.getElementById('token').value.trim();
    const message = document.getElementById('message').value.trim();
    const type = document.getElementById('msgType').value;
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');

    if (!token) {
        status.style.color = '#ef4444';
        status.innerText = 'يرجى إدخال التوكن.';
        return;
    }

    localStorage.setItem('bot_token', token);

    status.style.color = '#f59e0b';
    status.innerText = 'جاري البحث عن جميع المستلمين...';

    let chatIds = [];
    try {
        const updatesRes = await fetch(`https://api.telegram.org/bot${token}/getUpdates`);
        const updatesData = await updatesRes.json();
        if (updatesData.ok && updatesData.result) {
            const ids = updatesData.result.map(u => 
                u.message?.chat?.id || 
                u.edited_message?.chat?.id || 
                u.callback_query?.message?.chat?.id || 
                u.my_chat_member?.chat?.id
            ).filter(Boolean);
            chatIds = [...new Set(ids)];
        }
    } catch (e) {
        status.style.color = '#ef4444';
        status.innerText = 'حدث خطأ أثناء جلب قائمة المستلمين.';
        return;
    }

    if (chatIds.length === 0) {
        status.style.color = '#ef4444';
        status.innerText = 'لم يتم العثور على أي محادثات سابقة للبوت مع المستخدمين.';
        return;
    }

    let endpoint = '';
    if (type === 'text') {
        if (!message) {
            status.style.color = '#ef4444';
            status.innerText = 'اكتب نص الرسالة أولاً!';
            return;
        }
        endpoint = 'sendMessage';
    } 
    else if (type === 'photo' || type === 'video' || type === 'document') {
        if (!fileInput.files[0]) {
            status.style.color = '#ef4444';
            status.innerText = 'يرجى اختيار ملف من الجهاز!';
            return;
        }
        endpoint = type === 'photo' ? 'sendPhoto' : (type === 'video' ? 'sendVideo' : 'sendDocument');
    } 
    else if (type === 'voice') {
        if (!recordedAudioBlob) {
            status.style.color = '#ef4444';
            status.innerText = 'قم بتسجيل صوت أولاً قبل الإرسال!';
            return;
        }
        endpoint = 'sendVoice';
    }

    status.innerText = `جاري الإرسال إلى ${chatIds.length} مستخدم...`;
    let successCount = 0;

    for (const chatId of chatIds) {
        const formData = new FormData();
        formData.append('chat_id', chatId);
        if (message) formData.append('parse_mode', 'HTML');

        if (type === 'text') {
            formData.append('text', message);
        } else if (type === 'photo' || type === 'video' || type === 'document') {
            formData.append(type, fileInput.files[0]);
            if (message) formData.append('caption', message);
        } else if (type === 'voice') {
            formData.append('voice', recordedAudioBlob, 'voice.ogg');
            if (message) formData.append('caption', message);
        }

        try {
            const response = await fetch(`https://api.telegram.org/bot${token}/${endpoint}`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            if (data.ok) successCount++;
        } catch (err) {}
    }

    if (successCount > 0) {
        status.style.color = '#22c55e';
        status.innerText = `تم الإرسال بنجاح إلى ${successCount} من أصل ${chatIds.length} مستخدم!`;
        document.getElementById('message').value = '';
        fileInput.value = '';
        recordedAudioBlob = null;
        document.getElementById('audioPreview').style.display = 'none';
    } else {
        status.style.color = '#ef4444';
        status.innerText = 'فشل الإرسال إلى المستلمين.';
    }
}
</script>

</body>
</html>
